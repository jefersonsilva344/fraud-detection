services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fraud-detection-api

    ports:
      - "8000:8000"

    volumes:
      - fraud-data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501

    environment:
      FRAUD_API_URL: http://fraud-api:8000

    ports:
      - "8501:8501"

    depends_on:
      fraud-api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  fraud-data:
